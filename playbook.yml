---
- name: Laboratorio Ansible con dos servidores
  hosts: docker
  gather_facts: true

  tasks:
    - name: Mostrar nombre del servidor
      ansible.builtin.debug:
        msg: "Servidor: {{ inventory_hostname }}"

    - name: Mostrar sistema operativo
      ansible.builtin.debug:
        msg: "Sistema: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear directorio ansible-demo
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear archivo info.txt
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ inventory_hostname }}
          Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}
        mode: '0644'

    - name: Crear carpetas mediante loop
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje cuando sea Ubuntu
      ansible.builtin.debug:
        msg: "El servidor {{ inventory_hostname }} utiliza Ubuntu"
      when: ansible_distribution == "Ubuntu"
